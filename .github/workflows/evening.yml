name: Investegate – Evening (19:45 London)

on:
  schedule:
    # BST: 19:45 London = 18:45 UTC
    - cron: '45 18 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Show current UTC & London time
        run: |
          date -u +"UTC now: %Y-%m-%d %H:%M:%S"
          TZ=Europe/London date +"London now: %Y-%m-%d %H:%M:%S %Z"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil

      # Restore seen.json for deduplication
      - name: Restore seen.json cache
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.ref_name }}
          restore-keys: |
            seen-

      - name: Run scraper
        run: |
          python investegate_scraper.py \
            --pages 2 \
            --per_page 300 \
            --since_days 7 \
            --min_score 1 \
            --keywords_file keywords.txt

      - name: Locate latest CSV
        id: find_csv
        run: |
          set -e
          latest_dir="$(ls -td out/* 2>/dev/null | head -1)"
          if [ -z "$latest_dir" ] || [ ! -f "$latest_dir/investegate_hits.csv" ]; then
            echo "No hits CSV found under out/*/" >&2
            exit 1
          fi
          echo "CSV_FILE=$latest_dir/investegate_hits.csv" >> "$GITHUB_ENV"
          echo "Latest CSV: $latest_dir/investegate_hits.csv"

      - name: Email NEW items only (inline HTML + attach CSV)
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CSV_FILE: ${{ env.CSV_FILE }}
        run: |
          python - << 'PY'
          import os, csv, json, smtplib, mimetypes
          from pathlib import Path
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders
          from email.utils import formataddr

          csv_path = Path(os.environ["CSV_FILE"])
          state_file = Path(".state/seen_urls.json")
          state_file.parent.mkdir(parents=True, exist_ok=True)

          seen = set()
          if state_file.exists():
              try:
                  seen = set(json.loads(state_file.read_text(encoding="utf-8")))
              except Exception:
                  pass

          rows = []
          if csv_path.exists():
              with csv_path.open("r", encoding="utf-8", newline="") as f:
                  for row in csv.DictReader(f):
                      if row.get("url"):
                          rows.append(row)

          new_rows = [r for r in rows if r["url"] not in seen]

          run_num = os.environ.get("GITHUB_RUN_NUMBER","?")
          from_name = os.environ.get("FROM_NAME","HD Capital")
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]
          to_email = os.environ["TO_EMAIL"]
          smtp_server = os.environ["SMTP_SERVER"]
          smtp_port = int(os.environ["SMTP_PORT"])

          if new_rows:
              html = ['<div style="font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif">']
              html.append(f'<h2 style="margin:0 0 10px">Investegate – NEW since last email (run #{run_num})</h2>')
              html.append('<ol style="padding-left:20px">')
              for r in new_rows:
                  title = r.get("title","").strip()
                  url = r.get("url","").strip()
                  dt = r.get("dt_iso","") or ""
                  meta = f" <span style='color:#888'>({dt})</span>" if dt else ""
                  html.append(f'<li><a href="{url}" target="_blank">{title}</a>{meta}</li>')
              html.append('</ol>')
              html.append('<p style="margin-top:12px;color:#666">Full CSV attached.</p>')
              html.append('</div>')
              html_body = "\n".join(html)
          else:
              html_body = (
                  '<div style="font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif">'
                  '<h2 style="margin:0 0 10px">No new items since the last email</h2>'
                  '<p>We deduplicated against previously emailed URLs.</p>'
                  '</div>'
              )

          msg = MIMEMultipart("mixed")
          msg["Subject"] = f"Investegate RNS Digest – run #{run_num}"
          msg["From"] = formataddr((from_name, username))
          msg["To"] = to_email

          alt = MIMEMultipart("alternative")
          alt.attach(MIMEText(html_body, "html", "utf-8"))
          msg.attach(alt)

          with csv_path.open("rb") as f:
              part = MIMEBase("text", "csv")
              part.set_payload(f.read())
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", "attachment", filename="investegate_hits.csv")
          msg.attach(part)

          with smtplib.SMTP(smtp_server, smtp_port) as server:
              server.ehlo()
              try:
                  server.starttls(); server.ehlo()
              except smtplib.SMTPException:
                  pass
              server.login(username, password)
              server.sendmail(username, [to_email], msg.as_string())

          print(f"Email sent. New items included: {len(new_rows)}; Total hits: {len(rows)}")

          for r in rows:
              u = r.get("url")
              if u: seen.add(u)
          state_file.write_text(json.dumps(sorted(list(seen))), encoding="utf-8")
          PY

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: investegate-evening-out
          path: out/
