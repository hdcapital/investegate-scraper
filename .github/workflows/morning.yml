name: Investegate – Morning (07:45 London)

on:
  schedule:
    # BST: 07:45 London = 06:45 UTC
    - cron: '55 07 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Show current UTC & London time
        run: |
          date -u +"UTC now: %Y-%m-%d %H:%M:%S"
          TZ=Europe/London date +"London now: %Y-%m-%d %H:%M:%S %Z"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil openai>=1.40.0

      # Unified Cache: Restores both Scraper History (seen.json) and Email History (email_history_urls.json)
      # They now both live in the .state/ folder
      - name: Restore/Save .state folder
        uses: actions/cache@v4
        with:
          path: .state
          # Key includes run number to always save a new cache at the end
          key: state-${{ github.ref_name }}-${{ github.run_number }}
          # Restore keys allow it to grab the cache from the PREVIOUS run (morning or evening)
          restore-keys: |
            state-${{ github.ref_name }}-
            state-

      - name: Run scraper
        run: |
          # Scraper will now look in .state/seen.json automatically
          python investegate_scraper.py \
            --pages 2 \
            --per_page 300 \
            --since_days 7 \
            --min_score 1 \
            --keywords_file keywords.txt

      - name: Locate latest CSV
        id: find_csv
        run: |
          set -e
          latest_dir="$(ls -td out/* 2>/dev/null | head -1)"
          if [ -z "$latest_dir" ] || [ ! -f "$latest_dir/investegate_hits.csv" ]; then
            echo "No hits CSV found under out/*/" >&2
            exit 1
          fi
          echo "CSV_FILE=$latest_dir/investegate_hits.csv" >> "$GITHUB_ENV"
          echo "Latest CSV: $latest_dir/investegate_hits.csv"

      - name: Email NEW items only
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CSV_FILE: ${{ env.CSV_FILE }}
          MAX_HISTORY_EMAILS: 6
        run: |
          # Emailer reads/writes to .state/email_history_urls.json
          python email_investegate.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: investegate-morning-out
          path: out/
