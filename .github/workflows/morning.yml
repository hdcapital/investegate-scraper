name: Investegate – Morning (07:55 London)

on:
  schedule:
    - cron: "55 07 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Show current UTC & London time
        run: |
          date -u +"UTC now: %Y-%m-%d %H:%M:%S"
          TZ=Europe/London date +"London now: %Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil

      - name: Run scraper
        run: |
          python investegate_scraper.py \
            --pages 2 --per_page 300 --since_days 7 \
            --min_score 1 --keywords_file keywords.txt

      - name: Locate latest CSV
        id: find_csv
        run: |
          set -e
          latest="$(ls -td out/* | head -1)"
          echo "CSV_FILE=$latest/investegate_hits.csv" >> $GITHUB_ENV

      - name: Email NEW items
        env:
          CSV_FILE: ${{ env.CSV_FILE }}
          STATE_MODE: "morning"
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python .github/scripts/email_investegate.py
