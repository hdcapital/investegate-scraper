name: Investegate – Morning (07:45 London)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investegate-morning
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check London scheduled time
        id: london_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scheduled="${{ github.event.schedule }}"
          london_offset="$(TZ=Europe/London date +'%z')"

          echo "Scheduled cron: $scheduled"
          echo "London offset now: $london_offset"

          # Avoid exact HH:MM checks because GitHub scheduled workflows can start late.
          # Instead, run the BST cron only during BST and the GMT cron only during GMT.
          if [ "$scheduled" = "45 06 * * *" ] && [ "$london_offset" = "+0100" ]; then
            echo "BST morning run - proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$scheduled" = "45 07 * * *" ] && [ "$london_offset" = "+0000" ]; then
            echo "GMT morning run - proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Wrong seasonal cron for current London offset - skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show current UTC & London time
        if: steps.london_time.outputs.should_run == 'true'
        run: |
          date -u +"UTC now: %Y-%m-%d %H:%M:%S"
          TZ=Europe/London date +"London now: %Y-%m-%d %H:%M:%S %Z"

      - name: Checkout repo
        if: steps.london_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.london_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.london_time.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil "openai>=1.40.0" yfinance

      - name: Run scraper
        if: steps.london_time.outputs.should_run == 'true'
        run: |
          python investegate_scraper.py \
            --pages 2 \
            --per_page 300 \
            --min_score 1 \
            --keywords_file keywords.txt

      - name: Locate latest CSV
        if: steps.london_time.outputs.should_run == 'true'
        id: find_csv
        run: |
          set -e
          latest_dir="$(ls -td out/* 2>/dev/null | head -1)"
          if [ -z "$latest_dir" ] || [ ! -f "$latest_dir/investegate_hits.csv" ]; then
            echo "No hits CSV found under out/*/" >&2
            exit 1
          fi
          echo "CSV_FILE=$latest_dir/investegate_hits.csv" >> "$GITHUB_ENV"
          echo "Latest CSV: $latest_dir/investegate_hits.csv"

      - name: Enrich company data
        if: steps.london_time.outputs.should_run == 'true'
        run: |
          python enrich_companies.py "$CSV_FILE"

      - name: Email NEW items only
        if: steps.london_time.outputs.should_run == 'true'
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CSV_FILE: ${{ env.CSV_FILE }}
          MAX_HISTORY_EMAILS: 6
        run: |
          python email_investegate.py

      - name: Commit and Push State
        if: success() && steps.london_time.outputs.should_run == 'true'
        run: |
          git config --global user.name "Investegate Bot"
          git config --global user.email "bot@noreply.github.com"
          git add .state/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update scraper state (run ${{ github.run_number }}) [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload output
        if: steps.london_time.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: investegate-morning-out
          path: out/
