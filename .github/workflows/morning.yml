name: Investegate – Morning (07:45 London)

on:
  schedule:
    # BST: 07:45 London = 06:45 UTC
    - cron: '55 07 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Show current UTC & London time
        run: |
          date -u +"UTC now: %Y-%m-%d %H:%M:%S"
          TZ=Europe/London date +"London now: %Y-%m-%d %H:%M:%S %Z"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil

      # Restore seen.json across runs to prevent re-reporting
      - name: Restore seen.json state
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.ref_name }}
          restore-keys: |
            seen-

      - name: Run scraper
        run: |
          python investegate_scraper.py \
            --pages 2 \
            --per_page 300 \
            --since_days 7 \
            --min_score 1 \
            --keywords_file keywords.txt

      # Locate the latest CSV file
      - name: Locate latest CSV
        id: find_csv
        run: |
          set -e
          latest_dir="$(ls -td out/* 2>/dev/null | head -1)"
          if [ -z "$latest_dir" ] || [ ! -f "$latest_dir/investegate_hits.csv" ]; then
            echo "No hits CSV found under out/*/" >&2
            exit 1
          fi
          echo "CSV_FILE=$latest_dir/investegate_hits.csv" >> "$GITHUB_ENV"
          echo "Latest CSV: $latest_dir/investegate_hits.csv"

      - name: Email NEW items only (inline HTML + attach CSV)
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          CSV_FILE: ${{ env.CSV_FILE }}
        run: |
          python - << 'PY'
          import os, csv, json, smtplib, mimetypes
          from pathlib import Path
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders
          from email.utils import formataddr

          csv_path = Path(os.environ["CSV_FILE"])
          state_file = Path(".state/seen_urls.json")
          state_file.parent.mkdir(parents=True, exist_ok=True)

          seen = set()
          if state_file.exists():
              try:
                  seen = set(json.loads(state_file.read_text(encoding="utf-8")))
              except Exception as e:
                  print("Warning: could not read seen_urls.json:", e)
                  seen = set()

